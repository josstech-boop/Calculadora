<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora-basica</title>
</head>

<body">
    <div class="container d-flex flex-column  p-4 rounded-4">
        <div class="mb-5 d-flex justify-content-around align-items-center">
            <input class="border border-secondary input rounded-2" type="text" readonly>
            <button type="button" class="btn btn-danger eliminar">CE</button>

        </div>

        <div class="d-flex justify-content-center mb-3 ">
            <button id="7" type="button" class="btn num ">7</button>
            <button id="8" type="button" class="btn num  ">8</button>
            <button id="9" type="button" class="btn num ">9</button>
            <button id="+" type="button" class="btn signos">+</button>

        </div>
        <div class="d-flex justify-content-center mb-3">
            <button id="4" type="button" class="btn num ">4</button>
            <button id="5" type="button" class="btn num">5</button>
            <button id="6" type="button" class="btn num">6</button>
            <button id="-" type="button" class="btn signos">-</button>
        </div>
        <div class="d-flex justify-content-center mb-3">
            <button id="1" type="button" class="btn num">1</button>
            <button id="2" type="button" class="btn num">2</button>
            <button id="3" type="button" class="btn num">3</button>
            <button id="*" type="button" class="btn signos">*</button>

        </div>
        <div class="d-flex justify-content-center">
            <button id="0" type="button" class="btn num">0</button>
            <button id="." type="button" class="btn num">.</button>
            <button  type="button" class="btn signos">=</button>
            <button id="/" type="button" class="btn signos">/</button>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./index.js"></script>

    </body>

</html>
